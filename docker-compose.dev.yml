services:
  app:
    image: node:22-alpine
    container_name: stock-analysis-app-dev
    working_dir: /app
    user: '${UID:-1000}:${GID:-1000}'
    command: yarn start:dev
    env_file:
      - .env
    environment:
      - DB_SYNCHRONIZE=true
    ports:
      - '${PORT}:${PORT}'
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - stock-network

  mysql:
    image: mysql:8.4
    container_name: stock-analysis-mysql-dev
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-stock_analysis}
    volumes:
      - mysql_dev_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - stock-network

  redis:
    image: redis:7-alpine
    container_name: stock-analysis-redis-dev
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped
    networks:
      - stock-network

volumes:
  mysql_dev_data:
  redis_dev_data:

networks:
  stock-network:
    driver: bridge
